openapi: 3.1.1
info:
  title: Regatta Port Bourgas Donation Checkout API
  version: 1.1.0
  description: |
    Create a EUR donation checkout for the ycpb.netlify.app website and check whether it was paid.

    Integration flow:
    1. POST /api/donations/checkout from https://ycpb.netlify.app.
    2. Navigate the customer's browser to the returned checkoutUrl. It redirects to a Bulgarian Stripe-hosted Checkout Session.
    3. Stripe redirects the browser to the requested successUrl or failureUrl and appends donationId to its query string.
    4. GET the returned statusUrl to confirm payment. The browser redirect alone does not confirm payment; paid status is set by a verified Stripe webhook event. It may remain pending briefly after the success redirect.

    The first verified transition to paid also triggers an internal organizer email. No extra API call is required.

    Browser API calls from https://ycpb.netlify.app include the Origin header automatically. Frontend code cannot set it manually. No API key is required. CORS allows this origin only. Origin is a browser boundary, not server-to-server authentication. Swagger UI is hosted on a different origin, so its "Try it out" requests are rejected; run the integration from the ycpb.netlify.app site.
servers:
  - url: https://www.regattaportbourgas.org
    description: Production
tags:
  - name: Donations
    description: Public donation checkout integration
paths:
  /api/donations/checkout:
    post:
      tags: [Donations]
      operationId: createDonationCheckout
      summary: Create a donation checkout
      description: |
        Saves a pending donation request and returns a browser checkout link.
        The amount is in EUR, not cents. Only amount is required in the JSON body.
        The browser supplies Origin automatically; calls from another or missing origin are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDonationCheckoutRequest'
            examples:
              customRedirects:
                summary: Donation with a name, note, and custom redirects
                value:
                  amount: '25.00'
                  name: Ivan Petrov
                  note: Support youth sailing
                  successUrl: https://ycpb.netlify.app/donation/thank-you
                  failureUrl: https://ycpb.netlify.app/donation/try-again
              minimum:
                summary: Only the required amount
                value:
                  amount: '25.00'
      responses:
        '201':
          description: Donation request saved; checkout is ready for browser navigation.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDonationCheckoutResponse'
              example:
                donationId: 123e4567-e89b-42d3-a456-426614174000
                checkoutUrl: https://www.regattaportbourgas.org/api/donations/123e4567-e89b-42d3-a456-426614174000/checkout
                statusUrl: https://www.regattaportbourgas.org/api/donations/123e4567-e89b-42d3-a456-426614174000/status
                status: pending
                amount: '25.00'
                currency: EUR
        '400':
          description: Invalid JSON body, amount, name, note, or redirect URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Origin is missing or is not https://ycpb.netlify.app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Origin is not allowed.
        '413':
          description: Request body exceeds 8192 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unable to save the donation checkout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Stripe donation configuration is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/donations/{donationId}/checkout:
    get:
      tags: [Donations]
      operationId: openDonationCheckout
      summary: Open the hosted checkout handoff
      description: |
        Navigate the customer's browser to checkoutUrl. This endpoint redirects to Stripe-hosted Checkout; do not fetch it as JSON or use it as an iframe API.
        Stripe Checkout contains one item labelled 50 години Яхт Клуб "Порт Бургас" at the requested donation amount and displays in Bulgarian. The optional note is stored in the database only.
      parameters:
        - $ref: '#/components/parameters/DonationId'
      responses:
        '303':
          description: Redirect to Stripe-hosted Checkout.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '404':
          description: Checkout ID not found.
        '409':
          description: Checkout is no longer pending or its Stripe session has expired.
        '503':
          description: Donation checkout is unavailable.
  /api/donations/{donationId}/status:
    get:
      tags: [Donations]
      operationId: getDonationStatus
      summary: Check donation payment status
      description: |
        Poll this endpoint after the customer returns from Stripe. The success redirect can arrive before the signed payment event. A cancelled or expired Stripe checkout remains pending.
      parameters:
        - $ref: '#/components/parameters/DonationId'
      responses:
        '200':
          description: Current status of the donation.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationStatusResponse'
              example:
                donationId: 123e4567-e89b-42d3-a456-426614174000
                status: paid
                amount: '25.00'
                currency: EUR
                paidAt: '2026-10-28T12:30:00.000Z'
                createdAt: '2026-10-28T12:28:00.000Z'
        '403':
          description: Origin is missing or is not https://ycpb.netlify.app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Donation ID is invalid or not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Payment status could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  parameters:
    DonationId:
      name: donationId
      in: path
      required: true
      description: UUID returned by the create checkout call, or appended to the browser return URL.
      schema:
        type: string
        format: uuid
      example: 123e4567-e89b-42d3-a456-426614174000
  schemas:
    CreateDonationCheckoutRequest:
      type: object
      required: [amount]
      properties:
        amount:
          description: EUR amount, at most two decimal places, from 0.50 to 999999.99. A decimal string is recommended to avoid floating-point formatting issues.
          oneOf:
            - type: string
              pattern: '^(?:0\.[5-9][0-9]?|[1-9][0-9]{0,5}(?:\.[0-9]{1,2})?)$'
              examples: ['25.00', '0.50']
            - type: number
              minimum: 0.50
              maximum: 999999.99
              multipleOf: 0.01
              examples: [25, 25.5]
        name:
          type: [string, 'null']
          maxLength: 200
          description: Optional donor name, saved in the database. Blank or omitted values are stored as null. If absent, the server tries to save the payer name from the signed Stripe checkout event; Stripe may omit it.
        note:
          type: [string, 'null']
          maxLength: 500
          description: Optional donation note, saved in the database only. It is not sent to Stripe or shown on the checkout page.
        successUrl:
          type: string
          format: uri
          pattern: '^https://ycpb\.netlify\.app(?:/|\?|#|$)'
          description: Browser redirect after Stripe Checkout completes. Must be on https://ycpb.netlify.app. Defaults to https://ycpb.netlify.app/?donation=success. The API appends donationId to the query string.
        failureUrl:
          type: string
          format: uri
          pattern: '^https://ycpb\.netlify\.app(?:/|\?|#|$)'
          description: Browser redirect after Stripe Checkout cancellation. Must be on https://ycpb.netlify.app. Defaults to https://ycpb.netlify.app/?donation=failure. The API appends donationId to the query string.
    CreateDonationCheckoutResponse:
      type: object
      required: [donationId, checkoutUrl, statusUrl, status, amount, currency]
      properties:
        donationId:
          type: string
          format: uuid
        checkoutUrl:
          type: string
          format: uri
          description: Navigate the customer's browser to this URL.
        statusUrl:
          type: string
          format: uri
          description: GET from the allowed origin to confirm payment.
        status:
          type: string
          const: pending
        amount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Normalized EUR amount with exactly two decimal places.
        currency:
          type: string
          const: EUR
    DonationStatusResponse:
      type: object
      required: [donationId, status, amount, currency, paidAt, createdAt]
      properties:
        donationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, paid, rolled_back]
          description: Only a verified payment notification can set paid. rolled_back is retained for legacy myPOS reversals.
        amount:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
        currency:
          type: string
          const: EUR
        paidAt:
          type: [string, 'null']
          format: date-time
          description: Timestamp of the first paid notification, or null. It may remain populated if status later becomes rolled_back.
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: Donation checkout is unavailable.
